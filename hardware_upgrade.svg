<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="24" fill="url(#bgGrad4)"/>
  <path d="M 0,100 L 600,100 M 0,200 L 600,200 M 0,300 L 600,300 M 150,0 L 150,400 M 300,0 L 300,400 M 450,0 L 450,400" stroke="#F59E0B" stroke-opacity="0.08" stroke-width="1"/>

  <!-- SSD NVMe & RAM Component Graphics -->
  <g filter="url(#goldGlow)" transform="translate(300, 160)">
    <!-- SSD Board -->
    <rect x="-140" y="-40" width="280" height="80" rx="10" fill="#047857" stroke="#10B981" stroke-width="3"/>
    <!-- Gold Pins -->
    <rect x="-130" y="-35" width="20" height="70" fill="#FBBF24"/>
    <rect x="-105" y="-35" width="10" height="70" fill="#FBBF24"/>

    <!-- Chips on Board -->
    <rect x="-70" y="-25" width="55" height="50" rx="4" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    <rect x="0" y="-25" width="55" height="50" rx="4" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    <rect x="70" y="-25" width="55" height="50" rx="4" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>

    <text x="0" y="-50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#FBBF24" text-anchor="middle">SSD NVMe ULTRA SPEED (10X MAIS RÁPIDO)</text>
  </g>

  <!-- Speed Gauge -->
  <g transform="translate(300, 260)">
    <path d="M -80,0 A 80,80 0 0,1 80,0" fill="none" stroke="#3F3F46" stroke-width="16" stroke-linecap="round"/>
    <path d="M -80,0 A 80,80 0 0,1 60,-50" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
    <polygon points="0,0 45,-45 25,-15" fill="#EF4444"/>
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
  </g>

  <!-- Banner -->
  <g transform="translate(300, 335)">
    <rect x="-220" y="-20" width="440" height="42" rx="21" fill="#78350F" stroke="#F59E0B" stroke-width="2"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#FEF3C7" text-anchor="middle">⚡ UPGRADE DE SSD + LIMPEZA FÍSICA &amp; PASTA TÉRMICA</text>
  </g>
</svg>
