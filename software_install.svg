<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0284C7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="24" fill="url(#bgGrad3)"/>
  <path d="M 0,100 L 600,100 M 0,200 L 600,200 M 0,300 L 600,300 M 150,0 L 150,400 M 300,0 L 300,400 M 450,0 L 450,400" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Software Pack Icons Floating -->
  <!-- Office Box Icon -->
  <g transform="translate(180, 150)" filter="url(#cyanGlow)">
    <rect x="-45" y="-55" width="90" height="110" rx="14" fill="#D97706" stroke="#FBBF24" stroke-width="3"/>
    <text x="0" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">W</text>
    <text x="0" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#FEF3C7" text-anchor="middle">OFFICE</text>
  </g>

  <!-- Drivers Icon -->
  <g transform="translate(300, 130)" filter="url(#cyanGlow)">
    <circle cx="0" cy="0" r="55" fill="url(#boxGrad)" stroke="#38BDF8" stroke-width="3"/>
    <path d="M -18,-18 L 18,18 M 18,-18 L -18,18 M 0,-25 L 0,25 M -25,0 L 25,0" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#BAE6FD" text-anchor="middle">DRIVERS ATUALIZADOS</text>
  </g>

  <!-- PDF / Utilities Icon -->
  <g transform="translate(420, 150)" filter="url(#cyanGlow)">
    <rect x="-45" y="-55" width="90" height="110" rx="14" fill="#DC2626" stroke="#FCA5A5" stroke-width="3"/>
    <text x="0" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle">PDF</text>
    <text x="0" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#FEE2E2" text-anchor="middle">UTILITÁRIOS</text>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(300, 325)">
    <rect x="-210" y="-20" width="420" height="42" rx="21" fill="#0369A1" stroke="#38BDF8" stroke-width="2"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#E0F2FE" text-anchor="middle">⚙️ INSTALAÇÃO DE PACOTES, DIVER&amp; APLICATIVOS</text>
  </g>
</svg>
