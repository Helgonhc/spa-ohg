<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091E12"/>
      <stop offset="50%" stop-color="#0F291E"/>
      <stop offset="100%" stop-color="#021A24"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#10B981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="24" fill="url(#bgGrad2)"/>
  <path d="M 0,100 L 600,100 M 0,200 L 600,200 M 0,300 L 600,300 M 150,0 L 150,400 M 300,0 L 300,400 M 450,0 L 450,400" stroke="#10B981" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Security Shield & Virus Clean -->
  <g filter="url(#emeraldGlow)" transform="translate(300, 180)">
    <!-- Outer Security Shield -->
    <path d="M 0,-110 L 90,-70 C 90,30 50,90 0,120 C -50,90 -90,30 -90,-70 Z" fill="url(#shieldGrad)" stroke="#6EE7B7" stroke-width="4"/>
    
    <!-- Shield Checkmark -->
    <path d="M -30,0 L -10,25 L 35,-25" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Eliminated Bugs / Virus Icons (Faded Crosses) -->
  <g transform="translate(130, 120)" opacity="0.7">
    <circle cx="0" cy="0" r="28" fill="#EF4444" opacity="0.2"/>
    <path d="M -12,-12 L 12,12 M 12,-12 L -12,12" stroke="#EF4444" stroke-width="4"/>
    <text x="0" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FCA5A5" text-anchor="middle">TROJAN REMOVIDO</text>
  </g>

  <g transform="translate(470, 120)" opacity="0.7">
    <circle cx="0" cy="0" r="28" fill="#EF4444" opacity="0.2"/>
    <path d="M -12,-12 L 12,12 M 12,-12 L -12,12" stroke="#EF4444" stroke-width="4"/>
    <text x="0" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FCA5A5" text-anchor="middle">SPYWARE BLOCKED</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 335)">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#A7F3D0" text-anchor="middle">🛡️ REMOÇÃO COMPLETA DE VÍRUS & DEEP CLEANING</text>
  </g>
</svg>
